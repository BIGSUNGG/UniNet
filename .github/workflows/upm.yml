name: upm-package

# CI: push/PR 시 패키지 정적 검증 · CD: v* 태그 시 검증 + GitHub Release 생성
# 태그 자체가 UPM Git URL 배포다 — 소비자는 #vX.Y.Z로 설치 (Document/deployment.md)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 패키지 정적 검증
        run: |
          ARGS=""
          [ "${GITHUB_REF_TYPE:-}" = "tag" ] && ARGS="--tag ${GITHUB_REF_NAME}"
          bash Package/tools/validate-package.sh $ARGS

      # FR-07 — 소스 생성기 회귀: 소스 빌드와 동봉 analyzer를 같은 headless 호스트로 각각 검증한다.
      # (update-dlls.sh는 C:/Projects/DS/unity-nuget 로컬 경로에 의존 — CI에서 실행하지 않는다.)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 소스 생성기 빌드 (Roslyn 4.3 / netstandard2.0)
        run: dotnet build CodeGenerator/UniNet.CodeGenerator.csproj -c Release
      - name: headless 회귀 — source-built analyzer
        run: >-
          dotnet run --project Tests/UniNet.CodeGenerator.Tests -c Release --
          "$(pwd)/CodeGenerator/bin/Release/netstandard2.0/UniNet.CodeGenerator.dll"
      - name: headless 회귀 — 동봉(packaged) analyzer
        run: >-
          dotnet run --project Tests/UniNet.CodeGenerator.Tests -c Release --
          "$(pwd)/Package/Runtime/UniNet.Unity/Analyzers/UniNet.CodeGenerator.dll"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 릴리스 노트 추출 (CHANGELOG 해당 버전 섹션)
        run: |
          TAG="${GITHUB_REF_NAME}"; VER="${TAG#v}"
          awk -v ver="$VER" '
            $0 == "## " ver { in_sec=1; next }
            in_sec && /^## / { in_sec=0 }
            in_sec { print }
          ' Package/CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "## UniNet $VER" > notes.md; }
      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "UniNet $GITHUB_REF_NAME" --notes-file notes.md
